labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions about how to run Recore, or about why a cell came out the way
        it did, belong here rather than in the issue tracker. An answer here can
        be marked as the answer, which is what makes the next person find it.

        Three things worth checking first, because they account for most
        questions:

        - Sequence evidence and presence are not the same thing. A cell can have
          a full-length hit behind it and still be `0` in
          `gene_presence_absence_recore.csv`. Under the default `balanced`
          policy only `STRICT_PRESENT`, `ALIAS_CLUSTER` and `SEQUENCE_ONLY`
          become presence calls; partial homology, pseudogenes, unvalidated
          missing CDSs and paralog hits stay in
          `gene_presence_absence_recore_states.csv` and in
          `orthology_evidence.tsv` with the reason attached. That is the
          intended answer, not a dropped rescue.
        - Clearing `--min-identity` and `--min-coverage` is not enough on its
          own. An adaptive guard raises both floors for clusters that are rare
          (below 20%, 10% and 3% prevalence) and for clusters whose
          representative sequence is short (under 300 bp, and again under 150
          bp). A hit at 94% identity clears the global default of 90 and can
          still come out as `matrix_action=audit_only_quality` carrying
          `adaptive_sequence_below_floor` in `risk_flags`. Same-locus context,
          meaning synteny support or a `STRICT_PRESENT` or `ALIAS_CLUSTER`
          state, is what overrides that.
        - Clusters below `--min-prevalence` are never searched at all. The
          default is `0.1`, so a cluster present in fewer than a tenth of the
          genomes produces no evidence rather than negative evidence. Set it to
          `0` for an exhaustive audit.

        If the tool crashed or refused to run, that is a
        [bug report](https://github.com/PathoGenOmics-Lab/recore/issues/new/choose)
        instead.

  - type: input
    attributes:
      label: Version
      description: The output of `recore --version`, plus the commit if you built from a branch.
      placeholder: recore 1.0.0
    validations:
      required: true

  - type: textarea
    attributes:
      label: What are you trying to find out
      description: >-
        The analysis behind the question, not only the symptom. Whether you are
        counting core genes, defending a reference-absent set, or checking one
        gene in one isolate changes which answer is the right one, and often
        changes which `--matrix-policy` you should be running.
    validations:
      required: true

  - type: textarea
    attributes:
      label: The command you ran
      description: >-
        The whole command, with every flag. `-a`, `--synteny`, `--matrix-policy`
        and `--min-prevalence` between them decide what Recore was allowed to
        conclude, so a question without them is a question about a run nobody
        can reconstruct.
      render: shell
    validations:
      required: true

  - type: textarea
    attributes:
      label: What you got, and what you expected instead
      description: >-
        Paste the rows in question if you can, tabs and all. A question about a
        corrected matrix can rarely be settled from a description of it.
    validations:
      required: true

  - type: textarea
    attributes:
      label: The evidence row, if the question is about a specific cell
      description: >-
        The line for that cluster and genome from `orthology_evidence.tsv`, with
        the header line above it, tabs and all. Optional, because plenty of
        questions here are not about one cell. But when yours is, this is the
        difference between an answer and a conversation: nearly every "why is
        this still absent" has its answer already written down in that row.
        `evidence_state` is what Recore decided it had found, `matrix_action`
        separates `audit_only_policy` (your policy excluded this class of
        evidence) from `audit_only_quality` (the policy allowed it, the guard
        did not), `adaptive_identity_floor` and `adaptive_coverage_floor` are
        what this cluster had to clear rather than the global thresholds, and
        `orthology_confidence_tier` with `risk_flags` says what was counted
        against it. The example below is the common one: a full-length hit in a
        locus with no annotated CDS, held out of the binary matrix by the
        `balanced` policy rather than by weak sequence.
      render: text
      placeholder: |
        decision	orthology_status	evidence_state	matrix_action	publication_status	evidence_strength	recommended_wording	gene_cluster	genome	rescue_type	identity	coverage	contig	start	end	strand	confidence	adaptive_identity_floor	adaptive_coverage_floor	adaptive_sequence_pass	orthology_confidence_score	orthology_confidence_tier	risk_flags	synteny	synteny_score	synteny_support_n	synteny_reference_contexts	synteny_neighbors	synteny_upstream_matches	synteny_downstream_matches	orf_integrity_signal	annotation_match	annotation_cluster	rejection_reason	fragment_note
        accepted	accepted_missing_cds_sequence	MISSING_CDS_UNVALIDATED	audit_only_policy	corrected_review	review	Sequence is present but the CDS is missing from the annotation; require synteny support before matrix correction.	group_681	L4_AS00146	MISSING_CDS	99.2	89.5	L4_AS00146	2195924	2197213	+	1.066	90.0	80.0	true	0.818	moderate_confidence	synteny_not_tested;missing_cds_without_synteny								in_frame_span				missing_cds_no_substantial_gff_overlap

  - type: textarea
    attributes:
      label: Where your inputs came from
      description: >-
        The pangenome pipeline behind the matrix and the mode it ran in, the
        assembler behind the genome FASTAs, the annotator behind the GFFs, and
        the minimap2 version. Say how many genome columns and how many clusters
        the matrix has, and whether the column names match the FASTA and GFF
        file stems exactly or only through an embedded `ASxxxxx` identifier: a
        column that matches nothing looks, from the outputs, exactly like a
        genome in which nothing was found.
      placeholder: |
        Matrix: Panaroo 1.5.0, --clean-mode moderate, 412 genomes, 8914 clusters
        Genomes: SPAdes 3.15 assemblies, one FASTA per column
        Annotations: Bakta 1.9 GFF3, one per column
        Column names: L4_AS00146 style, file stems match exactly
        minimap2: 2.28-r1209
    validations:
      required: true
