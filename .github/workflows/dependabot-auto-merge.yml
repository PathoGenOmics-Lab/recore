name: Dependabot auto-merge

# Merges Dependabot's routine updates once CI has passed, and never touches a
# major one.
#
# The point of the split is that a minor or patch bump that survives the whole
# suite (rustfmt, clippy with warnings denied, the unit tests, and the
# end-to-end run that CI forces to be real with RECORE_REQUIRE_MINIMAP2=1
# instead of letting it skip itself when minimap2 is missing from the image) has
# already been examined more carefully than a person would examine it by eye,
# while a major bump changes APIs and wants a person to look.
#
# Triggered by the pull request itself, not by a schedule.
#
# This job waits for CI instead of handing the waiting to GitHub, which is the
# one real difference from how this is usually written. `gh pr merge --auto`
# parks a merge until the required checks pass, and "required" means branch
# protection. This repository is private on the free plan, where branch
# protection does not exist, so nothing is marked required and `--auto` has
# nothing to wait for: it would merge on the spot, which is the single outcome
# this file exists to prevent. So the waiting happens here, in the open, where
# the gate is written down and can be read.

on: pull_request

permissions:
  contents: write # the merge itself
  pull-requests: write # merging and commenting on the pull request
  # Only the check runs are read below, but the rollup that carries them is a
  # mixed list of check runs and commit statuses, so it asks for both.
  checks: read
  statuses: read

# One waiter per pull request. Dependabot force-pushes when it rebases, and each
# push starts this workflow again; without this, the run watching the commit
# that no longer exists would sit here until its own timeout.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Merge routine updates once CI is green
    runs-on: ubuntu-latest
    # Long because the job spends most of it asleep, waiting on a suite that
    # installs minimap2 and then builds the crate twice, once for clippy and
    # once for the tests. The poll below gives up before this does, so a run
    # that runs out of patience ends by saying so on the pull request rather
    # than by being killed halfway through.
    timeout-minutes: 35
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read what this pull request updates
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The rule, decided once.
      #
      # Writing it twice, once negated for the step that explains itself, is the
      # version that rots: the two halves drift the moment the first is edited,
      # and then a grouped patch matches the merge step and the "left alone"
      # step at the same time, so it merges and announces that it did not. One
      # step decides, the others read the answer.
      #
      # Named rather than excluded: merge when the pull request says in so many
      # words that it is a patch or a minor, or when it is a `-routine` group,
      # which the configuration already restricts to those two.
      #
      # Asking instead whether the update was "not major" is the trap. A pip
      # requirement bump that only widens a range, `~=11.0` to `~=12.3`, reports
      # no update type at all, and an empty string is not equal to major, so the
      # negated rule says yes to a major on its first day. Anything this cannot
      # positively identify still waits for a person.
      #
      # A grouped pull request reports "the highest semver change being made by
      # this PR", so a group carrying one major is a major here, and a major
      # cannot slip through on the back of the patches it travels with.
      - name: Decide whether this one may merge itself
        id: decide
        env:
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          may_merge=false
          case "$GROUP" in
            *-routine) may_merge=true ;;
          esac
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) may_merge=true ;;
          esac
          # Printed because a decision nobody can read is a decision nobody can
          # correct: this line is what a later surprise gets diagnosed from.
          echo "group='${GROUP}' update-type='${UPDATE_TYPE}' -> may-merge=${may_merge}"
          echo "may-merge=${may_merge}" >> "$GITHUB_OUTPUT"

      # The gate is two checks:
      #
      #   CI / test              rustfmt, clippy -D warnings, and the test suite
      #                          with the end-to-end run made mandatory.
      #   Documentation / Build  mkdocs build --strict.
      #
      # The docs workflow is filtered by path, so on most of these pull requests
      # it never runs and never appears in the list. An absent check is read as
      # satisfied, not as pending, because the alternative is a cargo bump
      # sitting here until the timeout waiting for a job that was never going to
      # start. Reading it that way is safe because both workflows hang off the
      # same pull_request event: by the time `test` has finished, minutes later,
      # a docs run that was ever going to happen has long since registered
      # itself as queued. And it does happen on the pull requests where it
      # matters, since requirements-docs.txt and docs.yml are both in that
      # workflow's path filter.
      #
      # `test` can show up twice for the same commit, because ci.yml triggers on
      # a bare `push:` as well as on `pull_request` and Dependabot pushes its
      # branch to this repository, so the same job runs once for each event.
      # Both copies are read: pending if either is pending, green only if every
      # one of them is green.
      #
      # The check names are the job names GitHub publishes, not the job ids:
      # `test` has no `name:` in ci.yml so it is published under its id, and the
      # docs job is published as `Build`. Renaming either one over in those files
      # silently unhooks this gate, which is why the workflow name is matched
      # too: a second job called `Build` appearing somewhere else must not be
      # mistaken for the docs build.
      - name: Wait for CI to answer
        id: gate
        if: steps.decide.outputs.may-merge == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rollup="$(mktemp)"

          # missing, pending, success or failure, for one named job of one named
          # workflow. Statuses and conclusions are compared upper-cased because
          # the enum is what the API returns and the casing is not something to
          # bet a merge on. A check the runner skipped counts as satisfied: a
          # skip is the workflow saying this commit did not need it.
          state_of() {
            jq -r --arg workflow "$1" --arg job "$2" '
              [ (.statusCheckRollup // [])[]
                | select(.__typename == "CheckRun")
                | select(.name == $job)
                | select((.workflowName // "") == "" or (.workflowName // "") == $workflow)
                | { status:     (.status     // "" | ascii_upcase),
                    conclusion: (.conclusion // "" | ascii_upcase) } ]
              | if   length == 0                 then "missing"
                elif any(.status != "COMPLETED") then "pending"
                elif all(.conclusion == "SUCCESS" or .conclusion == "SKIPPED" or .conclusion == "NEUTRAL")
                                                 then "success"
                else                                  "failure"
                end
            ' "$rollup"
          }

          deadline=$(( $(date +%s) + 25 * 60 ))
          read_once=false

          while :; do
            # A transient API error should cost one poll, not the merge. With
            # `set -e` an unguarded call here would end the job in a way that
            # skips the steps below, so the pull request would be left with no
            # merge and no comment saying why.
            if ! gh pr view "$PR_URL" --json statusCheckRollup > "$rollup"; then
              echo "could not read the checks this time, trying again"
            else
              read_once=true
              # `|| echo unreadable` rather than a bare substitution: a jq that
              # trips over an unexpected payload must cost one poll, like the
              # API error above, not the whole job.
              ci="$(state_of 'CI' 'test' || echo unreadable)"
              docs="$(state_of 'Documentation' 'Build' || echo unreadable)"
              echo "CI/test=${ci} Documentation/Build=${docs}"

              if [ "$ci" = failure ] || [ "$docs" = failure ]; then
                echo "green=false" >> "$GITHUB_OUTPUT"
                echo "reason=a check failed" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              if [ "$ci" = success ] && { [ "$docs" = success ] || [ "$docs" = missing ]; }; then
                echo "green=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            # Two different givings-up, told apart because they want different
            # things done about them: checks that ran long, and checks that were
            # never read at all.
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "green=false" >> "$GITHUB_OUTPUT"
              if [ "$read_once" = true ]; then
                echo "reason=the checks had not finished after 25 minutes" >> "$GITHUB_OUTPUT"
              else
                echo "reason=the checks could not be read for 25 minutes" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi

            sleep 30
          done

      # A plain merge, not `--auto`: the waiting already happened, and asking
      # GitHub to wait as well would either be ignored or, with no required
      # check to wait for, be no wait at all.
      - name: Merge it
        if: steps.decide.outputs.may-merge == 'true' && steps.gate.outputs.green == 'true'
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Say why this one was left alone
        if: always() && steps.decide.outputs.may-merge != 'true'
        run: |
          gh pr comment "$PR_URL" --body \
            "Left for review. Only a \`-routine\` group, or an update that identifies itself as patch or minor, merges on its own once CI passes. This one is a major update or does not say which it is."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Said out loud, because the failure mode of a silent gate is a pull
      # request that looks abandoned. The wording comes from the step that did
      # the waiting, so this cannot report a reason that step did not reach.
      - name: Say why the merge did not happen
        if: always() && steps.decide.outputs.may-merge == 'true' && steps.gate.outputs.green != 'true'
        run: |
          gh pr comment "$PR_URL" --body \
            "Not merged: ${REASON:-the checks could not be read}. This one qualifies on its update type, so it will merge itself if the checks go green: push a fix, or re-run this workflow from the Actions tab once CI is passing."
        env:
          REASON: ${{ steps.gate.outputs.reason }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
