name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install minimap2
        run: sudo apt-get update && sudo apt-get install -y minimap2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
        env:
          # Fail instead of silently skipping the end-to-end test if the
          # dependency is missing from the runner image.
          RECORE_REQUIRE_MINIMAP2: "1"
