name: Label pull requests

# Puts the part-of-the-project labels on a pull request from the files it
# changes, so the labels are actually there when someone wants to filter by
# them. Configuration lives in .github/labeler.yml.
#
# `pull_request_target` rather than `pull_request` because labelling needs a
# token that can write, and `pull_request` hands a read-only one to anything
# coming from a fork. `pull_request_target` runs the workflow definition from
# the base branch and never checks out or executes the pull request's code,
# which is what makes it safe here: this job reads the list of changed
# filenames and writes labels, and touches nothing from the branch it is
# labelling. The repository being private does not change that reasoning, it
# only makes fork pull requests rare rather than impossible.
#
# One consequence of running from the base branch: the configuration is read
# from the base branch too. A pull request that edits .github/labeler.yml is
# labelled by the rules already on main, not by the rules it proposes, and the
# new rules only start applying once it merges. Worth remembering before
# concluding that a freshly added rule does not work.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply labels from the files changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Off on purpose. With it on, the action removes any configured label
          # the files no longer justify, including one a person put there
          # deliberately.
          sync-labels: false
