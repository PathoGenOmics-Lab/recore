site_name: Recore
site_description: >-
  Post-hoc rescue, audit, and quality control of pangenome presence/absence
  matrices. Recore recovers false absences with sequence evidence and keeps the
  evidence trail that explains every corrected cell.
site_author: PathoGenOmics Lab
site_url: https://pathogenomics-lab.github.io/recore/

repo_name: PathoGenOmics-Lab/recore
repo_url: https://github.com/PathoGenOmics-Lab/recore
edit_uri: edit/main/docs/
copyright: Copyright &copy; PathoGenOmics Lab &middot; GPL-3.0

theme:
  name: material
  logo: assets/recore_logo.svg
  favicon: assets/recore_logo.svg
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    admonition:
      note: material/dna
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

# Broken cross-references and dead anchors become warnings, which `mkdocs build
# --strict` in CI turns into a failed build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PathoGenOmics-Lab/recore
      name: Recore on GitHub
  generator: false

nav:
  - Home: index.md
  - Getting started:
      - getting-started/installation.md
      - getting-started/tutorial.md
      - getting-started/quickstart.md
      - getting-started/inputs.md
  - User guide:
      - guide/parameters.md
      - guide/matrix-policies.md
      - guide/outputs.md
      - guide/report.md
  - How it works:
      - how-it-works/algorithm.md
      - how-it-works/evidence-states.md
      - how-it-works/rescue-types.md
      - how-it-works/limits.md
  - About:
      - about/changelog.md
      - about/citation.md
      - about/contributing.md
