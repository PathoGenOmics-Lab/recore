site_name: Recore
site_description: >-
  Post-hoc rescue, audit, and quality control of pangenome presence/absence
  matrices. Recore recovers false absences with sequence evidence and keeps the
  evidence trail that explains every corrected cell.
site_author: PathoGenOmics Lab
site_url: https://pathogenomics-lab.github.io/recore/

repo_name: PathoGenOmics-Lab/recore
repo_url: https://github.com/PathoGenOmics-Lab/recore
edit_uri: edit/main/docs/
copyright: Copyright &copy; PathoGenOmics Lab &middot; GPL-3.0

theme:
  name: material
  # The wordmark is 2.2:1 wide, so Material's square logo slot sets it in type
  # too small to read. The stylesheet gives it the width it needs and swaps the
  # light and dark files on the reader's chosen scheme, because three of the
  # mark's inks fall under 3:1 on a black masthead.
  logo: assets/recore_logo.svg
  favicon: assets/recore_logo.svg
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  features:
    # Fourteen pages in four groups fit in one sidebar, so they are all shown at
    # once as always-open sections. `navigation.tabs` moves the groups into the
    # header and leaves the sidebar showing only the group you are in, which on
    # a site this size hides three quarters of the map to save nothing.
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    # A breadcrumb above each page title, so a reader arriving from search knows
    # where they landed.
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    # Numbered notes anchored inside a code block, so a long command can be
    # explained flag by flag without repeating it underneath.
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    # Abbreviations and links get a real tooltip instead of the browser's.
    - content.tooltips
    - content.action.edit
    - content.action.view
    - toc.follow
  # Three states rather than two: the site follows the reader's system setting
  # until they choose otherwise, and their choice is remembered. The masthead is
  # neutral in both, so the page is one sheet with a hairline across it rather
  # than a saturated band above the content.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference

# Broken cross-references and dead anchors become warnings, which `mkdocs build
# --strict` in CI turns into a failed build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PathoGenOmics-Lab/recore
      name: Recore on GitHub
  generator: false

nav:
  - Home: index.md
  - Getting started:
      - getting-started/installation.md
      - getting-started/tutorial.md
      - getting-started/quickstart.md
      - getting-started/inputs.md
  - User guide:
      - guide/parameters.md
      - guide/matrix-policies.md
      - guide/outputs.md
      - guide/report.md
  - How it works:
      - how-it-works/algorithm.md
      - how-it-works/evidence-states.md
      - how-it-works/rescue-types.md
      - how-it-works/evolutionary-events.md
      - how-it-works/limits.md
  - About:
      - about/changelog.md
      - about/citation.md
      - about/contributing.md
